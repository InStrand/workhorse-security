# The pack's own CI: the test suite on both runners, and the security gate run on the pack itself.
name: tests

on:
  push:
  pull_request:

permissions: {}

jobs:
  tests:
    name: tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Report tool versions
        run: |
          node --version
          python3 --version
          git --version
          bash --version | head -1
      - name: Install shellcheck when missing
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            if [ "$RUNNER_OS" = "macOS" ]; then brew install shellcheck; else sudo apt-get install -y shellcheck; fi
          fi
          shellcheck --version
      - name: Run the test suite
        run: ./test/run.sh

  security:
    name: security
    permissions:
      contents: read
    uses: $/.github/workflows/security.yml
